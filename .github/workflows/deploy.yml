# Push to main → run tests → build → upload to the cPanel host → migrate & cache.
#
# Two delivery modes, picked automatically from the repository secrets
# (Settings → Secrets and variables → Actions). See DEPLOY.md.
#   SSH (recommended): SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH  [+ SSH_PORT, PHP_BIN]
#   FTP (no SSH):      FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR, SITE_URL, DEPLOY_TOKEN
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JS dependencies and build
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build production release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          rm .env
          rm -rf node_modules

      # ---------- SSH mode ----------
      - name: Upload over SSH (rsync)
        if: env.SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.SSH_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude='.git' --exclude='.github' --exclude='.env' --exclude='/storage/' \
            --exclude='/public/storage' --exclude='/tests/' --exclude='/node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Migrate and cache over SSH
        if: env.SSH_HOST != ''
        run: |
          PORT="${{ secrets.SSH_PORT }}"; PORT="${PORT:-22}"
          PHP="${{ secrets.PHP_BIN }}"; PHP="${PHP:-php}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && $PHP artisan migrate --force && $PHP artisan optimize:clear && $PHP artisan optimize && $PHP artisan queue:restart"

      # ---------- FTP mode (hosts without SSH) ----------
      - name: Upload over FTP
        if: env.SSH_HOST == '' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env
            storage/**
            public/storage
            tests/**
            node_modules/**

      - name: Migrate and cache via deploy hook
        if: env.SSH_HOST == '' && env.FTP_SERVER != ''
        run: |
          curl --fail-with-body -sS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "${{ secrets.SITE_URL }}/_deploy/finish"

      - name: No deploy target configured
        if: env.SSH_HOST == '' && env.FTP_SERVER == ''
        run: echo "::warning::No SSH_HOST or FTP_SERVER secret set — tests passed but nothing was deployed. See DEPLOY.md."
