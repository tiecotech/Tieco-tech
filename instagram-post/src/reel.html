<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Tieco Reel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Plex;font-weight:400;src:url(assets/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Plex;font-weight:600;src:url(assets/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Plex;font-weight:700;src:url(assets/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Plex;font-weight:400;src:url(assets/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Plex;font-weight:600;src:url(assets/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Plex;font-weight:700;src:url(assets/ibm-plex-sans-arabic-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}

:root{--bg:#070b22;--ink:#f4f6ff;--mut:#a9b3d6;--p:#6a3bff;--m:#ff3ebe;--o:#ff7a45;--line:rgba(169,179,214,.24);--glass:rgba(16,24,58,.66);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;transform:scale(var(--s,1));transform-origin:center;
  background:var(--bg);overflow:hidden;font-family:Plex,"Segoe UI",Tahoma,sans-serif;color:var(--ink);direction:rtl}
.grad{background:linear-gradient(90deg,var(--p),var(--m) 55%,var(--o));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .06em}

/* ---------- background ---------- */
.bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(170px)}
.b1{width:1100px;height:1100px;background:var(--p);left:-480px;top:-380px;opacity:.65;animation:drift 9s ease-in-out infinite}
.b2{width:900px;height:900px;background:var(--m);right:-520px;top:640px;opacity:.36;animation:drift 11s ease-in-out infinite reverse}
.b3{width:900px;height:900px;background:var(--o);left:60px;bottom:-560px;opacity:.36;animation:drift 13s ease-in-out infinite}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(169,179,214,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(169,179,214,.07) 2px,transparent 2px);background-size:100px 100px;
  animation:gridmove 4s linear infinite;-webkit-mask-image:radial-gradient(circle at 50% 48%,#000 15%,transparent 72%);mask-image:radial-gradient(circle at 50% 48%,#000 15%,transparent 72%)}
.dot{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:floaty var(--fd,6s) ease-in-out var(--dl,0s) infinite}
#flash{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);opacity:0;z-index:50}
#flash.go{animation:flash .55s ease-out}

/* ---------- scenes ---------- */
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:250px 90px 430px;text-align:center}
.scene.on{display:flex;animation:sOut .4s ease-in calc(var(--d) - .4s) forwards}
.scene.last.on{animation:none}
.in{opacity:0;animation:up .7s var(--ease) var(--delay,0s) forwards}
.pop{opacity:0;animation:pop .6s var(--ease) var(--delay,0s) forwards}
h1,h2{font-weight:700;letter-spacing:0}

/* hook */
#s1 .bulb{position:relative;width:420px;height:420px;display:grid;place-items:center;margin-bottom:30px}
#s1 .bulb::before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(255,62,190,.6),rgba(106,59,255,.3) 50%,transparent 72%);filter:blur(30px);animation:glow 1s ease-in-out infinite}
#s1 .bulb svg{position:relative;width:300px;height:300px;fill:none;stroke:url(#gr);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#s1 .ray{position:absolute;left:50%;top:50%;width:6px;height:46px;margin:-210px 0 0 -3px;border-radius:3px;background:linear-gradient(var(--o),transparent);transform-origin:50% 210px;transform:rotate(var(--a)) scaleY(0);animation:ray .5s ease-out var(--rd) forwards}
#s1 h2{font-size:92px;line-height:1.2}
#s1 h1{font-size:176px;line-height:1.25}
#s1 p{margin-top:26px;font-size:54px;color:var(--mut)}

/* turn */
#s2 .kick{font-size:104px;font-weight:600;line-height:1.3}
#s2 .big{font-size:190px;line-height:1.3;position:relative}
#s2 .bar{width:760px;height:12px;border-radius:6px;margin-top:6px;background:linear-gradient(90deg,var(--p),var(--m),var(--o));transform-origin:right;transform:scaleX(0);animation:grow .8s var(--ease) .55s forwards}
#s2 .steps{margin-top:96px;display:flex;align-items:center;gap:16px;font-size:44px;font-weight:600}
#s2 .steps span.c{padding:18px 34px;border-radius:999px;border:2px solid var(--line);background:var(--glass)}
#s2 .steps svg{width:36px;height:36px;fill:none;stroke:var(--m);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* logo */
.logo{position:relative;width:460px;height:460px;display:grid;place-items:center}
.logo::before{content:"";position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(255,62,190,.55),rgba(106,59,255,.3) 48%,transparent 70%);filter:blur(26px);animation:glow 2.4s ease-in-out infinite}
.logo .orbit{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:spin 14s linear infinite}
.logo .ring{fill:none;stroke:url(#gr);opacity:0;animation:ringin 1s var(--ease) .7s forwards}
.logo .r1{stroke-width:1.2;stroke-dasharray:6 10}
.logo .r2{stroke-width:2;stroke-dasharray:120 380}
.logo .sat{fill:var(--o);filter:drop-shadow(0 0 8px var(--o));opacity:0;animation:ringin .5s ease 1.1s forwards}
.logo .mark{position:relative;width:62%;aspect-ratio:640/543}
.logo .half{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 22px 34px rgba(106,59,255,.5))}
.logo .half.l{animation:inL .9s var(--ease) .05s both}
.logo .half.r{animation:inR .9s var(--ease) .2s both}
#s3 .word{height:70px;width:auto;margin-top:26px}
#s3 h2{margin-top:20px;font-size:124px;line-height:1.3}
#s3 p{margin-top:10px;font-size:52px;color:var(--mut)}

/* service scenes */
.svc .cnt{display:flex;align-items:center;gap:18px;direction:ltr;font-size:36px;font-weight:600;color:var(--mut);letter-spacing:.1em}
.svc .cnt i{width:64px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.svc .viz{direction:ltr;position:relative;width:560px;height:480px;margin:34px 0 22px;display:grid;place-items:center}
.svc h2{font-size:104px;line-height:1.3}
.svc p{margin-top:12px;font-size:52px;line-height:1.5;color:var(--mut);max-width:900px}
.svc .dots{margin-top:40px;display:flex;gap:14px;direction:ltr}
.svc .dots b{width:16px;height:16px;border-radius:50%;background:rgba(169,179,214,.25)}
.svc .dots b.on{width:54px;border-radius:8px;background:linear-gradient(90deg,var(--c1),var(--c2))}

/* viz: web */
.v-web{position:relative;width:500px;height:400px;border-radius:34px;border:3px solid var(--line);background:var(--glass);overflow:hidden;box-shadow:0 40px 90px -40px var(--c1)}
.v-web .tb{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:2px solid var(--line)}
.v-web .tb i{width:16px;height:16px;border-radius:50%}.v-web .tb i:nth-child(1){background:#ff5f57}.v-web .tb i:nth-child(2){background:#febc2e}.v-web .tb i:nth-child(3){background:#28c840}
.v-web .tb b{flex:1;height:22px;margin-left:16px;border-radius:11px;background:rgba(169,179,214,.18)}
.v-web .hero{margin:26px 26px 20px;height:130px;border-radius:22px;background:linear-gradient(110deg,var(--c1),var(--c2));transform-origin:left;animation:grow .7s var(--ease) .1s both}
.v-web .row{display:flex;gap:18px;margin:0 26px}
.v-web .row span{flex:1;height:120px;border-radius:20px;background:rgba(169,179,214,.16);animation:up .6s var(--ease) both}
.v-web .row span:nth-child(1){animation-delay:.45s}.v-web .row span:nth-child(2){animation-delay:.6s}.v-web .row span:nth-child(3){animation-delay:.75s}
.v-web .cur{position:absolute;width:64px;height:64px;left:300px;top:150px;fill:#fff;stroke:#0b1230;stroke-width:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));animation:cur 1s var(--ease) .2s both}

/* viz: code */
.v-code{width:520px;height:400px;border-radius:34px;border:3px solid var(--line);background:rgba(7,11,34,.8);overflow:hidden;box-shadow:0 40px 90px -40px var(--c1)}
.v-code .tb{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:2px solid var(--line)}
.v-code .tb i{width:16px;height:16px;border-radius:50%}.v-code .tb i:nth-child(1){background:#ff5f57}.v-code .tb i:nth-child(2){background:#febc2e}.v-code .tb i:nth-child(3){background:#28c840}
.v-code .ln{padding:26px 30px;display:grid;gap:20px}
.v-code .ln p{height:20px;border-radius:10px;background:var(--lc);width:var(--w);margin-left:var(--i,0);transform-origin:left;transform:scaleX(0);animation:grow .45s var(--ease) var(--dl) forwards}
.v-code .caret{display:inline-block;width:14px;height:26px;background:var(--m);border-radius:3px;animation:blink .8s steps(1) infinite;margin-left:var(--i,0)}

/* viz: phone */
.v-phone{position:relative;width:270px;height:470px;border-radius:56px;border:5px solid var(--line);background:var(--glass);overflow:hidden;box-shadow:0 40px 90px -40px var(--c1)}
.v-phone .notch{position:absolute;left:50%;top:14px;width:90px;height:22px;margin-left:-45px;border-radius:11px;background:#02040f}
.v-phone .scr{position:absolute;inset:62px 22px 28px;display:grid;gap:18px;align-content:start}
.v-phone .scr b{height:110px;border-radius:24px;background:linear-gradient(135deg,var(--c1),var(--c2));animation:up .6s var(--ease) .1s both}
.v-phone .scr span{height:78px;border-radius:20px;background:rgba(169,179,214,.16);animation:up .6s var(--ease) both}
.v-phone .scr span:nth-of-type(1){animation-delay:.35s}.v-phone .scr span:nth-of-type(2){animation-delay:.5s}.v-phone .scr span:nth-of-type(3){animation-delay:.65s}
.v-phone-wrap{position:relative}
.v-phone-wrap .note{position:absolute;right:-150px;top:70px;width:230px;padding:18px 20px;border-radius:24px;background:#fff;color:#0b1230;font-size:30px;font-weight:600;direction:rtl;text-align:right;box-shadow:0 24px 50px -20px #000;opacity:0;animation:pop .5s var(--ease) .95s forwards}
.v-phone-wrap .note::before{content:"";display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--m);margin-left:10px;vertical-align:-2px}

/* viz: brand */
.v-brand{position:relative;width:520px;height:420px}
.v-brand i{position:absolute;top:92px;width:230px;height:230px;border-radius:50%;background:var(--c);mix-blend-mode:screen;opacity:0;animation:pop .6s var(--ease) var(--dl) forwards}
.v-brand i:nth-child(1){left:20px;--dl:.1s}.v-brand i:nth-child(2){left:145px;--dl:.3s}.v-brand i:nth-child(3){left:270px;--dl:.5s}
.v-brand svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.v-brand path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease .6s forwards}
.v-brand rect{fill:#fff;opacity:0;animation:pop .3s ease 1.3s forwards}

/* viz: ads */
.v-ads{position:relative;width:480px;height:480px;display:grid;place-items:center}
.v-ads .r{position:absolute;width:220px;height:220px;border-radius:50%;border:4px solid var(--c1);opacity:0;animation:wave 1.4s ease-out infinite}
.v-ads .r:nth-child(2){animation-delay:.45s}.v-ads .r:nth-child(3){animation-delay:.9s}
.v-ads .tile{position:relative;width:230px;height:230px;border-radius:64px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 40px 80px -30px var(--c1);animation:pop .6s var(--ease) both}
.v-ads .tile svg{width:128px;height:128px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.v-ads .chip{position:absolute;padding:14px 24px;border-radius:999px;background:var(--glass);border:2px solid var(--line);font-size:32px;font-weight:600;direction:rtl;opacity:0;animation:pop .5s var(--ease) var(--dl) forwards}

/* viz: camera */
.v-cam{position:relative;width:500px;height:400px}
.v-cam s{position:absolute;width:90px;height:90px;border:0 solid #fff;opacity:0;animation:pop .4s var(--ease) both}
.v-cam s:nth-child(1){left:0;top:0;border-width:8px 0 0 8px;border-top-left-radius:26px}
.v-cam s:nth-child(2){right:0;top:0;border-width:8px 8px 0 0;border-top-right-radius:26px}
.v-cam s:nth-child(3){left:0;bottom:0;border-width:0 0 8px 8px;border-bottom-left-radius:26px}
.v-cam s:nth-child(4){right:0;bottom:0;border-width:0 8px 8px 0;border-bottom-right-radius:26px}
.v-cam .focus{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border:5px solid var(--c1);border-radius:30px;animation:focus 1.2s var(--ease) .2s both}
.v-cam .focus::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--c1)}
.v-cam .rec{position:absolute;left:34px;top:34px;display:flex;align-items:center;gap:12px;font-size:32px;font-weight:700;letter-spacing:.14em}
.v-cam .rec b{width:20px;height:20px;border-radius:50%;background:#ff3b3b;animation:blink .9s steps(1) infinite}
.v-cam em{position:absolute;right:34px;bottom:30px;font-style:normal;font-size:32px;font-weight:600;color:var(--mut);letter-spacing:.1em}

/* viz: growth */
.v-grow{position:relative;width:520px;height:420px}
.v-grow .bars{position:absolute;left:0;right:0;bottom:0;height:340px;display:flex;align-items:flex-end;gap:22px;border-bottom:3px solid var(--line)}
.v-grow .bars i{flex:1;height:var(--h);border-radius:16px 16px 0 0;background:linear-gradient(var(--c2),var(--c1));transform-origin:bottom;transform:scaleY(0);animation:rise .7s var(--ease) var(--dl) forwards}
.v-grow svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.v-grow path{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease .7s forwards;filter:drop-shadow(0 6px 14px rgba(255,255,255,.35))}
.v-grow circle{fill:#fff;opacity:0;animation:pop .4s ease 1.6s forwards}

/* closing */
#s11 h1{font-size:150px;line-height:1.3}
#s11 h2{font-size:150px;line-height:1.3}
#s11 .icons{margin-top:70px;display:flex;gap:14px;direction:rtl}
#s11 .icons i{width:116px;height:116px;border-radius:34px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:0;animation:pop .5s var(--ease) var(--dl) forwards}
#s11 .icons svg{width:64px;height:64px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* CTA */
#s12 .mini{width:300px;filter:drop-shadow(0 40px 70px rgba(106,59,255,.6));animation:pop .8s var(--ease) both}
#s12 h1{margin-top:26px;font-size:240px;line-height:1.2}
#s12 .pill{margin-top:34px;display:inline-flex;position:relative;overflow:hidden;padding:34px 76px;border-radius:999px;font-size:68px;font-weight:700;color:#fff;direction:ltr;background:linear-gradient(110deg,var(--p),var(--m));box-shadow:0 36px 80px -26px var(--m)}
#s12 .pill::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 1.8s ease-in-out .9s infinite}
#s12 p{margin-top:44px;font-size:54px;line-height:1.55;font-weight:600}
#s12 .chips{margin-top:40px;display:flex;gap:20px;font-size:40px;font-weight:600}
#s12 .chips span{display:inline-flex;align-items:center;gap:12px;padding:18px 34px;border-radius:999px;border:2px solid var(--line);background:var(--glass)}
#s12 .chips svg{width:40px;height:40px;fill:none;stroke:var(--o);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

@keyframes up{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{to{transform:scaleY(1)}}
@keyframes sOut{to{opacity:0;transform:scale(1.05)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,50px) scale(1.1)}}
@keyframes gridmove{to{background-position:0 100px}}
@keyframes floaty{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-46px);opacity:.8}}
@keyframes flash{0%{opacity:0;transform:translateX(60%)}20%{opacity:1}100%{opacity:0;transform:translateX(-60%)}}
@keyframes glow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
@keyframes ray{to{transform:rotate(var(--a)) scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate(-70%,-18%) rotate(-16deg)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translate(70%,18%) rotate(16deg)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@keyframes cur{from{transform:translate(-190px,170px);opacity:0}30%{opacity:1}to{transform:none}}
@keyframes wave{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(2.1)}}
@keyframes focus{0%{transform:scale(2.2);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes shine{0%,65%{left:-60%}100%{left:130%}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a3bff"/><stop offset=".55" stop-color="#ff3ebe"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>
    <symbol id="i-web" viewBox="0 0 24 24"><path d="M3 7a3 3 0 013-3h12a3 3 0 013 3v10a3 3 0 01-3 3H6a3 3 0 01-3-3zM3 9h18"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
    <symbol id="i-mobile" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.5h2"/></symbol>
    <symbol id="i-brand" viewBox="0 0 24 24"><path d="M12 3l2.4 5 5.6.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9 5.6-.8z"/></symbol>
    <symbol id="i-ads" viewBox="0 0 24 24"><path d="M3 11v3a1 1 0 001 1h2l7 4V6L6 10H4a1 1 0 00-1 1zM17 8.5a5 5 0 010 7M20 6a8.5 8.5 0 010 12"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 015.5 7H8l1.4-2h5.2L16 7h2.5A1.5 1.5 0 0120 8.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 17.5z"/><circle cx="12" cy="13" r="3.4"/></symbol>
    <symbol id="i-grow" viewBox="0 0 24 24"><path d="M3 20h18M5 16l4.5-5 3.5 3L19 7M14.5 7H19v4.5"/></symbol>
  </defs>
</svg>

<div id="stage">
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div><div id="dots"></div></div>

  <!-- 1: hook -->
  <section class="scene" id="s1" data-d="2400">
    <div class="bulb pop">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0012 3z"/></svg>
    </div>
    <h2 class="in" style="--delay:.2s">هل لديك</h2>
    <h1 class="in grad" style="--delay:.45s">فكرة مشروع؟</h1>
    <p class="in" style="--delay:.95s">لا تتركها حبيسة رأسك</p>
  </section>

  <!-- 2: turn -->
  <section class="scene" id="s2" data-d="2300">
    <p class="kick in">نحوّلها إلى</p>
    <h1 class="big grad in" style="--delay:.25s">واقعٍ رقميّ</h1>
    <div class="bar"></div>
    <div class="steps">
      <span class="c in" style="--delay:.8s">فكرة</span><svg class="in" style="--delay:.95s" viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
      <span class="c in" style="--delay:1.05s">تصميم</span><svg class="in" style="--delay:1.2s" viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
      <span class="c in" style="--delay:1.3s">برمجة</span><svg class="in" style="--delay:1.45s" viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
      <span class="c in" style="--delay:1.55s">إطلاق</span>
    </div>
  </section>

  <!-- 3: logo -->
  <section class="scene" id="s3" data-d="2400">
    <div class="logo">
      <svg class="orbit" viewBox="0 0 200 200"><circle class="ring r1" cx="100" cy="100" r="94"/><circle class="ring r2" cx="100" cy="100" r="80"/><circle class="sat" cx="100" cy="6" r="3.2"/></svg>
      <div class="mark"><img class="half l" src="assets/tieco-symbol-left.png" alt=""><img class="half r" src="assets/tieco-symbol-right.png" alt=""></div>
    </div>
    <img class="word in" style="--delay:.9s" src="assets/tieco-wordmark-white.png" alt="Tieco Tech">
    <h2 class="in grad" style="--delay:1.1s">تايكو تيك</h2>
    <p class="in" style="--delay:1.3s">من الفكرة إلى الحل الرقمي</p>
  </section>

  <!-- 4-10 services are generated below -->

  <!-- 11: closing -->
  <section class="scene" id="s11" data-d="2600">
    <h1 class="in grad">سبع خدمات</h1>
    <h2 class="in" style="--delay:.3s">وفريقٌ واحد</h2>
    <div class="icons" id="icons"></div>
  </section>

  <!-- 12: CTA -->
  <section class="scene last" id="s12" data-d="4800">
    <img class="mini" src="assets/tieco-symbol.png" alt="">
    <h1 class="grad in" style="--delay:.3s">قريبًا</h1>
    <div class="pill pop" style="--delay:.6s">tieco-tech.com</div>
    <p class="in" style="--delay:.9s">تابعنا كي لا يفوتك الإطلاق</p>
    <div class="chips">
      <span class="in" style="--delay:1.3s"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>احفظ الفيديو</span>
      <span class="in" style="--delay:1.5s"><svg viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></svg>أرسله لصاحب فكرة</span>
    </div>
  </section>

  <div id="flash"></div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const stage = $('#stage');
const params = new URLSearchParams(location.search);

/* scale the 1080x1920 stage to the window */
function fit() { stage.style.setProperty('--s', Math.min(innerWidth / 1080, innerHeight / 1920)); }
addEventListener('resize', fit); fit();

/* floating particles (seeded, so every take looks the same) */
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
$('#dots').innerHTML = Array.from({ length: 26 }, () => {
  const s = 3 + rnd() * 6;
  return `<i class="dot" style="left:${rnd() * 100}%;top:${rnd() * 100}%;width:${s}px;height:${s}px;--fd:${4 + rnd() * 5}s;--dl:${-rnd() * 6}s"></i>`;
}).join('');

/* hook rays */
$('#s1 .bulb').insertAdjacentHTML('beforeend', Array.from({ length: 9 }, (_, k) => {
  const a = -80 + k * 20; return `<i class="ray" style="--a:${a}deg;--rd:${0.35 + k * 0.04}s"></i>`;
}).join(''));

/* ---- the seven services ---- */
const SVC = [
  { ic: 'web', c1: '#6a3bff', c2: '#ff3ebe', title: 'المواقع الإلكترونية', sub: 'سريعة وسهلة التحديث',
    viz: `<div class="v-web"><div class="tb"><i></i><i></i><i></i><b></b></div><div class="hero"></div><div class="row"><span></span><span></span><span></span></div>
          <svg class="cur" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg></div>` },
  { ic: 'code', c1: '#ff3ebe', c2: '#ff7a45', title: 'البرمجيات والأنظمة', sub: 'أنظمة مخصّصة على قياس عملك',
    viz: `<div class="v-code"><div class="tb"><i></i><i></i><i></i></div><div class="ln">
          <p style="--w:46%;--lc:#ff3ebe;--dl:.1s"></p><p style="--w:72%;--i:34px;--lc:#6a3bff;--dl:.25s"></p><p style="--w:58%;--i:34px;--lc:#ff7a45;--dl:.4s"></p>
          <p style="--w:36%;--i:68px;--lc:#3ddc97;--dl:.55s"></p><p style="--w:64%;--i:34px;--lc:#6a3bff;--dl:.7s"></p><p style="--w:30%;--lc:#ff3ebe;--dl:.85s"></p><span class="caret"></span></div></div>` },
  { ic: 'mobile', c1: '#ff7a45', c2: '#ffb347', title: 'تطبيقات الجوال', sub: 'لأندرويد وiOS من طلبٍ واحد',
    viz: `<div class="v-phone-wrap"><div class="v-phone"><i class="notch"></i><div class="scr"><b></b><span></span><span></span><span></span></div></div><div class="note">طلبٌ جديد</div></div>` },
  { ic: 'brand', c1: '#6a3bff', c2: '#ff3ebe', title: 'الهوية البصرية', sub: 'شعارات وهويات متماسكة',
    viz: `<div class="v-brand"><i style="--c:#6a3bff"></i><i style="--c:#ff3ebe"></i><i style="--c:#ff7a45"></i>
          <svg viewBox="0 0 520 420"><path pathLength="1" d="M40 330 C 40 60, 480 60, 480 330"/><rect x="30" y="320" width="20" height="20" rx="4"/><rect x="470" y="320" width="20" height="20" rx="4"/></svg></div>` },
  { ic: 'ads', c1: '#ff3ebe', c2: '#ff7a45', title: 'الإعلان والإبداع', sub: 'حملات برسالة واضحة وقابلة للقياس',
    viz: `<div class="v-ads"><i class="r"></i><i class="r"></i><i class="r"></i><div class="tile"><svg viewBox="0 0 24 24"><use href="#i-ads"/></svg></div>
          <span class="chip" style="--dl:.7s;right:-10px;top:50px">+240%</span><span class="chip" style="--dl:1s;left:-6px;bottom:60px">وصولٌ أكبر</span></div>` },
  { ic: 'cam', c1: '#ff7a45', c2: '#ff3ebe', title: 'التصوير والفيديو', sub: 'محتوى مرئي لعلامتك ومنتجاتك',
    viz: `<div class="v-cam"><s style="animation-delay:.05s"></s><s style="animation-delay:.12s"></s><s style="animation-delay:.19s"></s><s style="animation-delay:.26s"></s>
          <div class="focus"></div><div class="rec"><b></b>REC</div><em>00:07</em></div>` },
  { ic: 'grow', c1: '#3ddc97', c2: '#6a3bff', title: 'التحوّل الرقمي', sub: 'انقل عملك اليدوي إلى أنظمة تنمو معك',
    viz: `<div class="v-grow"><div class="bars"><i style="--h:26%;--dl:.1s"></i><i style="--h:40%;--dl:.2s"></i><i style="--h:34%;--dl:.3s"></i><i style="--h:56%;--dl:.4s"></i><i style="--h:72%;--dl:.5s"></i><i style="--h:92%;--dl:.6s"></i></div>
          <svg viewBox="0 0 520 420"><path pathLength="1" d="M30 300 L130 250 L230 270 L330 170 L430 120 L490 40"/><circle cx="490" cy="40" r="14"/></svg></div>` },
];
const anchor = $('#s11');
SVC.forEach((s, i) => {
  const dots = SVC.map((_, k) => `<b class="${k === i ? 'on' : ''}"></b>`).join('');
  anchor.insertAdjacentHTML('beforebegin', `
    <section class="scene svc" id="s${4 + i}" data-d="1800" style="--c1:${s.c1};--c2:${s.c2}">
      <div class="cnt in"><i></i>0${i + 1} / 07</div>
      <div class="viz">${s.viz}</div>
      <h2 class="in" style="--delay:.15s">${s.title}</h2>
      <p class="in" style="--delay:.3s">${s.sub}</p>
      <div class="dots">${dots}</div>
    </section>`);
});
$('#icons').innerHTML = SVC.map((s, i) =>
  `<i style="--c1:${s.c1};--c2:${s.c2};--dl:${0.55 + i * 0.12}s"><svg viewBox="0 0 24 24"><use href="#i-${s.ic}"/></svg></i>`).join('');

/* ---- timeline ---- */
const scenes = [...document.querySelectorAll('.scene')];
const dur = scenes.map((s) => +s.dataset.d);
const starts = dur.map((_, i) => dur.slice(0, i).reduce((a, b) => a + b, 0));
const TOTAL = dur.reduce((a, b) => a + b, 0);
const flash = $('#flash');
let cur = -1;

function show(i) {
  if (i === cur) return;
  if (cur >= 0) scenes[cur].classList.remove('on');
  cur = i;
  scenes[i].style.setProperty('--d', dur[i] + 'ms');
  scenes[i].classList.add('on');
  if (i > 0) { flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }
}

function run() {
  return new Promise((resolve) => {
    cur = -1; scenes.forEach((s) => s.classList.remove('on'));
    let t0 = null;
    const loop = (now) => {
      if (t0 === null) t0 = now;
      const e = now - t0;
      let i = 0; while (i < starts.length - 1 && e >= starts[i + 1]) i++;
      show(i);
      if (e >= TOTAL) return resolve();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}

/* frame-exact seeking for rendering: window.seek(ms) pauses every animation at that moment */
window.seek = (T) => {
  let i = 0; while (i < starts.length - 1 && T >= starts[i + 1]) i++;
  const local = T - starts[i];
  show(i);
  document.getAnimations().forEach((a) => {
    const el = a.effect && a.effect.target;
    const inScene = el && el.closest && (el.closest('.scene') || el.id === 'flash');
    a.pause();
    a.currentTime = inScene ? local : T;
  });
  return { scene: i, local };
};
window.TOTAL = TOTAL;

/* freeze one scene for previews: ?scene=7 */
if (params.has('cap')) {
  /* rendering mode: nothing plays by itself, the renderer calls seek() */
} else if (params.has('scene')) {
  const i = +params.get('scene') - 1;
  scenes[i].style.setProperty('--d', '999999ms'); scenes[i].classList.add('on'); cur = i;
} else if (params.has('rec')) {
  document.title = 'Tieco Reel';
  record();
} else {
  (async function again() { await run(); await new Promise((r) => setTimeout(r, 1200)); again(); })();
}

/* ---- record this tab to a video file (saved by upload.php) ---- */
async function record() {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30, width: 1080, height: 1920 }, audio: false, preferCurrentTab: true });
    const st = stream.getVideoTracks()[0].getSettings();
    const types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const type = types.find((t) => MediaRecorder.isTypeSupported(t));
    const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
    const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    const stopped = new Promise((r) => (rec.onstop = r));
    rec.start(250); await sleep(900);
    await run(); await sleep(900);
    rec.stop(); await stopped; stream.getTracks().forEach((t) => t.stop());
    const res = await fetch('upload.php?ext=' + (type.startsWith('video/mp4') ? 'mp4' : 'webm'), { method: 'POST', body: new Blob(chunks, { type }) });
    document.title = 'DONE ' + st.width + 'x' + st.height + ' ' + type + ' ' + (await res.text());
  } catch (err) {
    document.title = 'ERROR ' + err;
  }
}
</script>
